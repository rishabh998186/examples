apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-app
  labels:
    app: canary-app
    pipecd.dev/variant: primary
spec:
  replicas: 5
  selector:
    matchLabels:
      app: canary-app
      pipecd.dev/variant: primary
  template:
    metadata:
      labels:
        app: canary-app
        pipecd.dev/variant: primary
    spec:
      containers:
      - name: main
        image: nginx:1.27
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"